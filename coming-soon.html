<style>
  :root {

  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font-family: var(--font-body);
    -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; min-height: 100svh;
  }
  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 48px 20px; text-align: center;
  }
  justin-signature { display: block; width: min(360px, 80vw); }
  .tag {
    font-family: var(--font-mono); font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
    color: var(--sage); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px;
  }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(44px, 8vw, 84px); line-height: 1.05; }
  h1 .green { color: var(--sage); }
  .sub { margin: 0; max-width: 520px; font-size: 20px; line-height: 1.6; color: var(--muted); }
  .sub-mono { font-family: var(--font-mono); font-size: 17px; color: var(--muted); min-height: 1.5em; }
  .cursor { display: inline-block; width: 2px; height: 1.1em; margin-left: 3px; vertical-align: -0.18em; background: var(--sage); animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding-top: 6px; }
  .btn {
    display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; border-radius: 6px;
    font-weight: 600; font-size: 17px; text-decoration: none; transition: background-color .18s ease, color .18s ease, border-color .18s ease;
  }
  .btn-solid { background: var(--sage); color: #FFFFFF; }
  .btn-solid:hover { background: var(--text); color: var(--bg); }
  .btn-ghost { border: 1px solid var(--line); color: var(--text); }
  .btn-ghost:hover { border-color: var(--text); }
  .socials { display: flex; gap: 8px; }
  .social {
    width: 48px; height: 48px; border-radius: 6px; border: 1px solid var(--line); color: var(--text);
    display: flex; align-items: center; justify-content: center; transition: background-color .18s ease, border-color .18s ease;
  }
  .social:hover { background: var(--sage); border-color: var(--sage); }
  a:focus-visible { outline: 2px solid var(--sage); outline-offset: 3px; }
  footer {
    display: flex; justify-content: center; gap: 14px; padding: 20px; border-top: 1px solid var(--line);
    font-family: var(--font-mono); font-size: 13px; color: #D4D0C8;
  }
  @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

<script>
  // Type out / delete the subtitle, like the main site's hero.
  (function () {
    var out = document.getElementById('typeText');
    if (!out || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var text = out.textContent, i = 0, del = false;
    out.textContent = '';
    (function tick() {
      if (!del) { out.textContent = text.slice(0, ++i); if (i >= text.length) { del = true; return setTimeout(tick, 1800); } setTimeout(tick, 85); }
      else { out.textContent = text.slice(0, --i); if (i <= 0) { del = false; return setTimeout(tick, 400); } setTimeout(tick, 40); }
    })();
  })();
</script>
