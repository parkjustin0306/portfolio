<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#171817" />
  <meta name="description" content="A new portfolio experience is coming soon." />
  <title>Coming Soon — Justin Park</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #171817;
      --text: #f3f2ed;
      --muted: #a5a6a1;
      --accent: #68a873;
      --line: rgba(255, 255, 255, 0.12);
    }

    * { box-sizing: border-box; }

    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 42%, rgba(104, 168, 115, 0.09), transparent 36%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Helvetica Neue", Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      width: min(100% - 48px, 920px);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 34px 0 26px;
    }

    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .wordmark {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 14px rgba(104, 168, 115, 0.5);
    }

    main {
      width: 100%;
      max-width: 740px;
      margin: 70px auto;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 24px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(3.6rem, 10vw, 7.4rem);
      line-height: 0.98;
      letter-spacing: -0.075em;
      font-weight: 600;
    }

    h1 span {
      display: block;
      color: var(--muted);
      font-weight: 400;
    }

    .description {
      max-width: 480px;
      margin: 28px auto 0;
      color: #c1c2bc;
      font-size: clamp(15px, 2vw, 17px);
      line-height: 1.8;
    }

    .rule {
      width: 56px;
      height: 1px;
      margin: 34px auto 0;
      background: var(--accent);
    }

    footer {
      border-top: 1px solid var(--line);
      padding-top: 18px;
      color: var(--muted);
      font-size: 12px;
    }

    footer p { margin: 0; }

    .footer-note {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .footer-note svg {
      width: 14px;
      height: 14px;
      color: var(--accent);
    }

    @media (max-width: 520px) {
      .page {
        width: min(100% - 36px, 920px);
        padding: 24px 0 20px;
      }

      header { align-items: flex-start; }
      .status { font-size: 9px; letter-spacing: 0.1em; }
      main { margin: 48px auto; }
      .description { max-width: 330px; }
      footer { align-items: flex-start; flex-direction: column; gap: 10px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .status-dot { animation: breathe 2.8s ease-in-out infinite; }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header>
      <div class="wordmark">Justin Park<span style="color: var(--accent)">.</span></div>
      <div class="status"><span class="status-dot" aria-hidden="true"></span> New portfolio in progress</div>
    </header>

    <main>
      <p class="eyebrow">A new experience is on the way</p>
      <h1>Coming <span>Soon.</span></h1>
      <p class="description">
        I’m working on something new. My portfolio is getting a refresh,
        and I can’t wait to share what’s next.
      </p>
      <div class="rule" aria-hidden="true"></div>
    </main>

    <footer>
      <p>© <span id="year">2026</span> Justin Park</p>
      <p class="footer-note">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M9 18V5l12-2v13"></path>
          <circle cx="6" cy="18" r="3"></circle>
          <circle cx="18" cy="16" r="3"></circle>
        </svg>
        Designing something worth the wait
      </p>
    </footer>
  </div>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
